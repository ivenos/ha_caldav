name: Bug Report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in as much detail as possible. Debug logging can be turned on in the menu of CalDAV Complete under Settings > Devices & services.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The lines mentioning ha_caldav from Settings > System > Logs. With debug logging they contain whole calendar entries, so read them before posting."
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "The file from Download diagnostics in the menu of CalDAV Complete under Settings > Devices & services. Credentials and the server address are redacted, calendar names are not."

  - type: input
    id: version
    attributes:
      label: "CalDAV Complete version"
      placeholder: "e.g. CalDAV Complete 1.3.0 on Home Assistant 2026.9.1"
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: CalDAV server
      placeholder: "e.g. Nextcloud 32.0.1, Radicale 3.3, Baikal 0.10"
    validations:
      required: true
