name: Bug Report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please fill in as much detail as possible.

        Debug logs help a lot. Add this to `configuration.yaml` and restart:

        ```yaml
        logger:
          logs:
            custom_components.ha_caldav: debug
        ```

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Paste the lines mentioning ha_caldav from Settings > System > Logs.
        Read them first if you raised the log level yourself: a CalDAV library
        at debug level writes out whole calendar objects.
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings > Devices & services > CalDAV Complete > the three-dot menu >
        Download diagnostics. Credentials and account names are redacted. Drag
        the file in here, or paste it.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.3.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      placeholder: "e.g. 1.1.0"
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: CalDAV server
      placeholder: "e.g. Nextcloud 32.0.1, Radicale 3.3, Baikal 0.10"
    validations:
      required: true
