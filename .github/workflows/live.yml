name: Live

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Catches the case unit tests never can: a new Nextcloud release breaking us
  # without a single line of our code changing.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  # Throwaway container that exists for the length of one job; nothing to hide.
  NEXTCLOUD_PASSWORD: "TestPass!2026"

jobs:
  nextcloud:
    name: Nextcloud ${{ matrix.nextcloud }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ["32", "33", "34", "latest"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Start Nextcloud ${{ matrix.nextcloud }}
        run: |
          docker run -d --name nextcloud -p 8080:80 \
            -e SQLITE_DATABASE=nextcloud \
            -e NEXTCLOUD_ADMIN_USER=admin \
            -e NEXTCLOUD_ADMIN_PASSWORD='${{ env.NEXTCLOUD_PASSWORD }}' \
            -e NEXTCLOUD_TRUSTED_DOMAINS=localhost \
            nextcloud:${{ matrix.nextcloud }}

      - name: Wait for the install to finish
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/status.php 2>/dev/null | grep -q '"installed":true'; then
              curl -fsS http://localhost:8080/status.php
              exit 0
            fi
            sleep 5
          done
          echo "::error::Nextcloud did not finish installing"
          docker logs --tail 50 nextcloud
          exit 1

      - name: Run live tests
        env:
          CALDAV_URL: http://localhost:8080/remote.php/dav
          CALDAV_USERNAME: admin
          CALDAV_PASSWORD: ${{ env.NEXTCLOUD_PASSWORD }}
        run: pytest -m live -v

      - name: Nextcloud logs
        if: failure()
        run: docker logs --tail 100 nextcloud
