name: Live

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Nextcloud is tested on the current major and the one behind it, resolved at
  # run time from Docker Hub so the pair stays current without anyone bumping a
  # pin. Radicale, Xandikos, Baikal and SOGo publish rolling images.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.build.outputs.include }}
    steps:
      - id: build
        run: |
          set -euo pipefail
          # Two pages so an actively patched previous major is not buried past
          # the last_updated window by a flood of newer-major variant tags.
          names=""
          for page in 1 2; do
            # Failures swallowed here, or set -e would abort the step before
            # the fallback below ever runs.
            names+=$(curl -fsS --retry 3 --retry-all-errors --max-time 30 \
              "https://hub.docker.com/v2/repositories/library/nextcloud/tags/?page_size=100&page=$page&ordering=last_updated" \
              | jq '.results[].name | select(test("^[0-9]+$")) | tonumber' || true)$'\n'
          done
          majors=$(jq -cs 'unique | sort | reverse | .[0:2]' <<<"$names")
          # A rate-limited Docker Hub must not fail a run that broke nothing.
          if test "$(jq length <<<"$majors")" -ne 2; then
            echo "::warning::could not resolve two Nextcloud majors, using the fallback"
            majors='[32, 31]'
          fi
          include=$(jq -cn --argjson m "$majors" \
            '[$m[] | {server: "nextcloud", tag: (. | tostring)}]
             + [{server: "radicale", tag: "latest"}, {server: "xandikos", tag: "latest"},
                {server: "baikal", tag: "latest"}, {server: "sogo", tag: "latest"}]')
          echo "include=$include" >> "$GITHUB_OUTPUT"

  live:
    needs: matrix
    name: ${{ matrix.server }} ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run live tests against ${{ matrix.server }} ${{ matrix.tag }}
        run: .github/scripts/live-test.sh ${{ matrix.server }} ${{ matrix.tag }} -- -v
