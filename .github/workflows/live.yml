name: Live

on:
  push:
    branches: [main]
    paths:
      - custom_components/**
      - tests/**
      - requirements_test.txt
      - pytest.ini
      - .github/workflows/live.yml
  pull_request:
    branches: [main]
    paths:
      - custom_components/**
      - tests/**
      - requirements_test.txt
      - pytest.ini
      - .github/workflows/live.yml
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.build.outputs.include }}
    steps:
      - id: build
        run: |
          set -euo pipefail
          # Two pages, as variant tags of the newest major can fill the first one.
          names=""
          for page in 1 2; do
            # || true, so a failed page reaches the check below.
            names+=$(curl -fsS --retry 3 --retry-all-errors --max-time 30 \
              "https://hub.docker.com/v2/repositories/library/nextcloud/tags/?page_size=100&page=$page&ordering=last_updated" \
              | jq '.results[].name | select(test("^[0-9]+$")) | tonumber' || true)$'\n'
          done
          majors=$(jq -cs 'unique | sort | reverse | .[0:2]' <<<"$names")
          if test "$(jq length <<<"$majors")" -ne 2; then
            echo "::error::could not resolve two Nextcloud majors"
            exit 1
          fi
          include=$(jq -cn --argjson m "$majors" \
            '[$m[] | {server: "nextcloud", tag: (. | tostring)}]
             + [{server: "radicale", tag: "latest"}, {server: "xandikos", tag: "latest"},
                {server: "baikal", tag: "latest"}, {server: "sogo", tag: "latest"}]')
          echo "include=$include" >> "$GITHUB_OUTPUT"

  live:
    needs: matrix
    name: ${{ matrix.server }} ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run live tests against ${{ matrix.server }} ${{ matrix.tag }}
        run: tests/live-test.sh ${{ matrix.server }} ${{ matrix.tag }} -- -v
