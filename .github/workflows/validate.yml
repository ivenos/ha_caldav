name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF_VERSION: "0.15.21"
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Upstream publishes no tags; @master is the documented usage.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@22.5.0
        with:
          category: integration
          # Custom repositories are not listed in home-assistant/brands.
          ignore: brands

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned so a new ruff release cannot fail CI unannounced; Renovate bumps it.
      # Full tag: the repo publishes no moving v4 major tag.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check

      - name: Check formatting
        run: ruff format --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest
