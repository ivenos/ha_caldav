name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  # Home Assistant 2026.3.1; no harness pins the 2026.3.0 hacs.json sets.
  OLDEST_HARNESS: "0.13.317"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Upstream publishes no tags; @master is the documented usage.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@22.5.0
        with:
          category: integration

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No moving major tag upstream.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: requirements_test.txt
          args: check

      - name: Check formatting
        run: ruff format --check

  test:
    name: test (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        homeassistant: [oldest, pinned]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Pin the oldest supported Home Assistant
        if: matrix.homeassistant == 'oldest'
        run: sed -i "s/^pytest-homeassistant-custom-component==.*/pytest-homeassistant-custom-component==$OLDEST_HARNESS/" requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest
