name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  # Home Assistant 2026.3.1; no harness pins the 2026.3.0 hacs.json sets.
  OLDEST_HARNESS: "0.13.317"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Upstream publishes no tags; @master is the documented usage.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # No moving major tag upstream.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: requirements_test.txt
          args: check

      - name: Check formatting
        run: ruff format --check

  test:
    name: test (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        homeassistant: [oldest, pinned]
    steps:
      - uses: actions/checkout@v7

      - name: Pin the oldest supported Home Assistant and the minimum requirements
        if: matrix.homeassistant == 'oldest'
        run: |
          sed -i "s/^pytest-homeassistant-custom-component==.*/pytest-homeassistant-custom-component==$OLDEST_HARNESS/" requirements_test.txt
          jq -r '.requirements[]' custom_components/ha_caldav/manifest.json | while read -r minimum; do
            sed -i "s/^${minimum%%>=*}==.*/${minimum/>=/==}/" requirements_test.txt
          done

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Check that this is the oldest Home Assistant hacs.json allows
        if: matrix.homeassistant == 'oldest'
        run: |
          python - <<'EOF'
          import json
          from homeassistant.const import __version__
          allowed = json.load(open("hacs.json"))["homeassistant"].rsplit(".", 1)[0]
          assert __version__.startswith(f"{allowed}."), (__version__, allowed)
          EOF

      - name: Check that the requirements follow Home Assistant core
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.version import Version
          import homeassistant.components.caldav as core
          ours = json.loads(Path("custom_components/ha_caldav/manifest.json").read_text())
          theirs = json.loads((Path(core.__file__).parent / "manifest.json").read_text())
          minimums = [Requirement(entry) for entry in ours["requirements"]]
          tested = dict(
              line.split("==") for line in Path("requirements_test.txt").read_text().split()
          )
          shipped = dict(pin.split("==") for pin in theirs["requirements"])
          assert sorted(minimum.name for minimum in minimums) == sorted(shipped), shipped
          for minimum in minimums:
              version = shipped[minimum.name]
              assert minimum.specifier.contains(version, prereleases=True), (minimum, version)
              assert Version(tested[minimum.name]) >= Version(version), (minimum.name, version)
          EOF

      - name: Check that the tested requirements cover the Home Assistant beta
        if: matrix.homeassistant == 'pinned' && github.event_name != 'pull_request'
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          from packaging.version import Version
          url = "https://raw.githubusercontent.com/home-assistant/core/rc/homeassistant/components/caldav/manifest.json"
          with urlopen(url, timeout=30) as response:
              shipped = dict(pin.split("==") for pin in json.load(response)["requirements"])
          tested = dict(
              line.split("==") for line in Path("requirements_test.txt").read_text().split()
          )
          for name, version in shipped.items():
              assert Version(tested[name]) >= Version(version), (name, version)
          EOF

      - name: Run tests
        run: pytest
