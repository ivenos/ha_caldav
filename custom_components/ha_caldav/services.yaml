move_event:
  target:
    entity:
      integration: ha_caldav
      domain: calendar
  fields:
    uid:
      required: true
      selector:
        text:
    target_entity_id:
      required: true
      selector:
        entity:
          integration: ha_caldav
          domain: calendar
    keep_original:
      default: false
      selector:
        boolean:

import_ics:
  target:
    entity:
      integration: ha_caldav
      domain: calendar
  fields:
    ics:
      required: true
      selector:
        text:
          multiline: true

export_ics:
  target:
    entity:
      integration: ha_caldav
      domain: calendar
  fields:
