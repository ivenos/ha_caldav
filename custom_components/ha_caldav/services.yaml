set_calendar_color:
  target:
    entity:
      integration: ha_caldav
      domain: calendar
  fields:
    color:
      required: true
      example: "#00679e"
      selector:
        text:

respond_to_invitation:
  target:
    entity:
      integration: ha_caldav
      domain: calendar
  fields:
    uid:
      required: true
      selector:
        text:
    response:
      required: true
      selector:
        select:
          translation_key: invitation_response
          options:
            - accept
            - decline
            - tentative

create_calendar:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ha_caldav
    name:
      required: true
      example: Holidays
      selector:
        text:
    components:
      selector:
        select:
          multiple: true
          translation_key: calendar_components
          options:
            - VEVENT
            - VTODO

delete_calendar:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ha_caldav
    name:
      required: true
      selector:
        text:
