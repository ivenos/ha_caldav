[pytest]
asyncio_mode = auto
testpaths = tests
# The console script does not put the repo root on sys.path the way
# `python -m pytest` does, so custom_components would not import.
pythonpath = .
# strict-markers: selection is purely by the live marker, so a typo would
# deselect the module from the live run and skip it in the unit run, leaving
# the tests gone with nothing failing anywhere.
addopts = -m "not live" --strict-markers --strict-config
markers =
    live: exercises a real CalDAV server; needs CALDAV_URL. Run with `pytest -m live`.
