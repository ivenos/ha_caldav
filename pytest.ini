[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts = -m "not live" --strict-markers --strict-config
timeout = 120
markers =
    live: needs a real CalDAV server, see tests/live-test.sh
# The harness freezes the GC, which hides the reference Hypothesis looks for.
filterwarnings =
    ignore:It looks like `register_random`:hypothesis.errors.HypothesisWarning
