target-version = "py314"
line-length = 88

[lint]
# BLE among them: this integration catches broadly on purpose in a dozen
# places, and the rule is what makes each of those noqa markers mean that a
# reader looked at it rather than that someone typed it.
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]

[lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
